services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pramaan
    networks:
      - pramaan-network
    init:
      true

  pramaan:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    command: ["node", "dist/index.js"]
    networks:
      - pramaan-network
    mem_limit: 512m
    cpus: 0.5
    init: true
    security_opt:
      - no-new-privileges:true
    

volumes:
  caddy_data:
  caddy_config:

networks:
  pramaan-network:
    driver: bridge
